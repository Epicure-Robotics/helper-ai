name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: epicure-assist
  APP_RUNNER_SERVICE_ARN: arn:aws:apprunner:ap-south-1:043309356330:service/epicure-assist/6ce1f7dd3c17452f852cbe1c1cda8895

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::043309356330:role/GitHubActionsDeployRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Write .env.production from Secrets Manager
        run: |
          for NAME in $(aws secretsmanager list-secrets --filter Key=name,Values="epicure-assist/prod/" --query "SecretList[*].Name" --output text); do
            VAR=$(basename "$NAME")
            VALUE=$(aws secretsmanager get-secret-value --secret-id "$NAME" --query SecretString --output text)
            echo "${VAR}=${VALUE}" >> .env.production
          done
          echo "EMAIL_SIGNUP_DOMAINS=" >> .env.production

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --platform linux/amd64 -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" -t "$REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"

      - name: Run database migration
        run: |
          set -a; source .env.production; set +a
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec drizzle-kit migrate --config ./db/drizzle.config.ts

      - name: Deploy to App Runner
        run: |
          aws apprunner start-deployment --service-arn "$APP_RUNNER_SERVICE_ARN"
          for i in $(seq 1 60); do
            STATUS=$(aws apprunner describe-service --service-arn "$APP_RUNNER_SERVICE_ARN" --query 'Service.Status' --output text)
            echo "status: $STATUS"
            if [ "$STATUS" = "RUNNING" ]; then exit 0; fi
            if [ "$STATUS" = "CREATE_FAILED" ] || [ "$STATUS" = "DELETE_FAILED" ]; then
              echo "Deployment failed"; exit 1
            fi
            sleep 15
          done
          echo "Timed out waiting for deployment to stabilize"; exit 1

      - name: Clean up secrets file
        if: always()
        run: rm -f .env.production
