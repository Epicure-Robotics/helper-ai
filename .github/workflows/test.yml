name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pure:
    name: Pure unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Logic-only suite: no Postgres, no testcontainers, so it runs on a plain runner.
      # The DB-backed suite (pnpm test:unit) stays out of CI until tests/support/factories
      # is restored — it was deleted in 45bc6da (May 2026) and 41 test files still import it.
      - name: Run pure unit tests
        run: pnpm test:pure
